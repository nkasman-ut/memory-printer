<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memory Peepbox</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="interview" aria-live="polite">
        <div class="prompt-stack">
          <h1 id="questionText">Think of a memory you wish you had a photograph of. Where were you?</h1>
        </div>

        <form id="answerForm" class="answer-form">
          <textarea id="answerInput" name="answer" rows="5" autocomplete="off"></textarea>
          <div id="voiceInput" class="voice-input" hidden>
            <button id="micButton" type="button" class="mic-button" aria-label="Speak your answer">
              <span class="mic-icon">&#9679;</span>
              <span id="micLabel">hold to speak</span>
            </button>
            <p id="transcript" class="transcript"></p>
          </div>
          <button id="typeToggle" type="button" class="type-toggle">speak instead</button>
          <fieldset id="feelingOptions" class="feeling-options" hidden>
            <legend>Choose up to three</legend>
          </fieldset>
          <div class="actions">
            <button id="backButton" type="button" class="secondary" disabled>← back</button>
            <button id="nextButton" type="submit">next →</button>
          </div>
        </form>
      </section>

      <section id="resultPanel" class="result-panel" hidden>
        <div class="status">
          <span id="generationState">finding your memory</span>
        </div>

        <div class="peephole-instruction">
          <p class="kicker" id="instructionKicker">your memory is being made</p>
          <h1 id="instructionText">Look through<br>the box</h1>
          <p class="instruction-helper" id="instructionHelper">Press your eye to the peephole when you're ready.</p>
        </div>

        <div id="memoryProgress" class="memory-progress" hidden>
          <div class="progress-bar-track">
            <div id="progressFill" class="progress-bar-fill"></div>
          </div>
          <p id="progressLabel" class="progress-label"></p>
        </div>

        <div id="einkPreview" class="eink-preview" hidden>
          <img id="einkImage" src="" alt="Memory preview" />
        </div>

        <div class="actions">
          <button id="printButton" type="button" class="secondary" hidden>print</button>
          <button id="resetButton" type="button">begin again</button>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
